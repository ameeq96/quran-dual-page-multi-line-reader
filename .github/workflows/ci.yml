name: Quran Reader CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_debug:
        description: Build an Android debug APK after all checks pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quran-reader-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Test safe bundle restoration
        run: python3 -m unittest discover -s tool -p test_restore_bundled_mushaf.py -v
      - name: Restore the pinned default 16-line scans
        run: python3 tool/restore_bundled_mushaf.py
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run permanent regression tests
        run: flutter test --no-pub
      - name: Run browser offline-pack regressions
        timeout-minutes: 8
        env:
          CHROME_EXECUTABLE: google-chrome
        run: flutter test --platform chrome --no-pub test/quran_offline_pack_browser_test.dart
      - name: Build web release
        run: flutter build web --release --no-pub
      - name: Save web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quran-reader-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  android-debug:
    if: github.event_name == 'workflow_dispatch' && inputs.android_debug
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Restore the pinned default 16-line scans
        run: python3 tool/restore_bundled_mushaf.py
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Save debug APK for device QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quran-reader-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
